<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Boodschappenlijst</title>
</head>
<body>
    <table id="groceryList">
        <thead>
            <th>Product</th>
            <th>Prijs</th>
            <th>Hoeveelheid</th>
            <th>Subtotaal</th>
        </thead>
        <tr>
            <td>Rijst</td>
            <td class="productPrice" >1.00</td>
            <td><input class="productQuantity" type="number" placeholder="0" min="0" max="999"></td>
            <td class="productTotalCost" >0.00</td>
        </tr>
        <tr>
            <td>Broccoli</td>
            <td class="productPrice" >0.99</td>
            <td><input class="productQuantity" type="number" placeholder="0" min="0" max="999"></td>
            <td class="productTotalCost" >0.00</td>
        </tr>
        <tr>
            <td>Koekjes</td>
            <td class="productPrice" >1.20</td>
            <td><input class="productQuantity" type="number" placeholder="0" min="0" max="999"></td>
            <td class="productTotalCost" >0.00</td>
        </tr> 
        <tr>
            <td>Noten</td>
            <td class="productPrice" >2.99</td>
            <td><input class="productQuantity" type="number" placeholder="0" min="0" max="999"></td>
            <td class="productTotalCost" >0.00</td>
        </tr>
        <tr>
            <td colspan="3">Totaal</td>
            <td id="totalCost" >0.00</td>
        </tr>
    </table>
    
    <script src="script.js"></script>
</body>
</html>
