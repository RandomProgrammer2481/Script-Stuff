<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">

    <title>JavaScript Blackjack</title>
</head>
<body>
    
    <table>
        <tr>
            <td id="dealerTotal">Dealer Total:</td>
        </tr>

        <tr id="dealerCards">
        </tr>
            
        <tr>
            <td id="playerTotal">Your Total:</td>
        </tr>

        <tr id="playerCards">
        </tr>

        <tr>
            <td>
                <button id="hit">Deal</button>
                <button id="stay">Stay</button>
                <h4 class="hidden" id="endGameText"> Placeholder endGameText</h4>
                <button class="hidden" id="replay">Play Again?</button>
            </td>
        </tr>
        <tr>

        </tr>
    </table>
    
    <footer>
        <h4>Playing Card art by <a href="https://elvgames.itch.io/playing-cards-pixelart-asset-pack"><strong>ELVGames</strong></a></h6>
    </footer>

</html>
